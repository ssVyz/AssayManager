{{define "content"}}
{{$r := .Data.Result}}
<div class="pagehead">
  <h1>Run #{{$r.ID}}</h1>
  <a class="btn secondary" href="/results">Back to results</a>
</div>

{{if .Data.Downloads}}
<h2>Downloads</h2>
<p class="actions">
  {{range .Data.Downloads}}<a class="btn secondary" href="/results/{{$r.ID}}/download/{{.Kind}}">{{.Label}}</a> {{end}}
</p>
{{end}}

{{template "result_detail" .Data}}
{{end}}
