<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{if .Title}}{{.Title}} · {{end}}AssayManager</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/app.js" defer></script>
</head>
<body class="printdoc">
  <div class="printbar no-print">
    <button type="button" data-print>Save as PDF</button>
    <a class="btn secondary" href="/results">Back to results</a>
    <span class="muted">Opens your browser's print dialog — choose “Save as PDF”, paper size A4, orientation portrait.</span>
  </div>
  <main class="printcontent">
    {{block "content" .}}{{end}}
  </main>
</body>
</html>
